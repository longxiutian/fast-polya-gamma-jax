[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-polya-gamma-jax"
version = "0.1.0"
description = "Fast fixed-cost Pólya-Gamma approximations implemented in pure JAX."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Longxiu Tian"},
]
keywords = [
  "jax",
  "numpyro",
  "polya-gamma",
  "gibbs-sampling",
  "bayesian-computation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "jax>=0.4.30",
]

[project.urls]
Homepage = "https://github.com/longxiutian/fast-polya-gamma-jax"
Repository = "https://github.com/longxiutian/fast-polya-gamma-jax"
Issues = "https://github.com/longxiutian/fast-polya-gamma-jax/issues"

[project.optional-dependencies]
numpyro = [
  "numpyro>=0.22",
]
test = [
  "numpy>=1.26",
  "numpyro>=0.22",
  "pytest>=8",
  "ruff>=0.6",
]
reference = [
  "polyagamma>=2",
]
benchmark = [
  "numpy>=1.26",
  "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
